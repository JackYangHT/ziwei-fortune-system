<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Jack 老師 AI 命理工具</title>
  <link rel="icon" type="image/svg+xml" href="icon.svg">
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#000000">
  <link rel="stylesheet" href="chatgpt.css">
</head>
<body>
  <div class="chatgpt-app-container">
    <!-- Top Header -->
    <header class="chatgpt-header">
      <a href="landing.html" class="brand-section" title="返回首頁 / Home">
        <span class="brand-logo">🔮</span>
        <span class="brand-name" id="uiBrandName">Jack 老師 AI 命理</span>
      </a>

      <div class="header-actions">
        <!-- 語言切換選單 -->
        <select id="langToggleSelect" class="lang-select" title="切換語言 / Switch Language">
          <option value="zh">繁體中文</option>
          <option value="th">ไทย</option>
          <option value="en">English</option>
          <option value="ja">日本語</option>
        </select>

        <!-- 展開/收合輸入區按鈕 -->
        <button id="btnToggleInput" class="btn-header-action" title="收合或展開出生資料輸入區">
          <span id="btnToggleInputIcon">📝</span>
          <span id="btnToggleInputText">編輯出生資料</span>
        </button>

        <!-- 關於我們連結 -->
        <a href="about.html" class="btn-header-action" id="uiAboutLink" title="關於 Jack 老師">
          <span>ℹ️</span>
          <span id="uiAboutLinkText">關於</span>
        </a>
      </div>
    </header>

    <!-- Top Collapsible Input Form Area -->
    <section id="inputSectionWrapper" class="input-section-wrapper">
      <div class="input-card">
        <div class="input-card-header">
          <span class="input-card-title">
            <span>📋</span>
            <span id="uiInputCardTitle">出生資料輸入（排盤基準）</span>
          </span>
          <button id="btnCloseInputCard" class="btn-collapse-toggle" title="收合輸入區">✕ 收合</button>
        </div>

        <!-- Row 1: 姓名、出生日期、出生時間 -->
        <div class="form-grid-3">
          <div class="input-group">
            <label for="newClientName" class="input-label" id="uiLabelName">姓名（選填）</label>
            <input type="text" id="newClientName" class="form-control" placeholder="例如：張先生、李小姐">
          </div>
          <div class="input-group">
            <label for="newBirthday" class="input-label" id="uiLabelBirthday">出生日期 (西元)</label>
            <input type="date" id="newBirthday" class="form-control" value="1977-07-26">
          </div>
          <div class="input-group">
            <label for="newBirthClockTime" class="input-label" id="uiLabelClockTime">出生時間 (HH:mm)</label>
            <input type="time" id="newBirthClockTime" class="form-control" value="08:00">
          </div>
        </div>

        <!-- Row 2: 出生地、性別、API Key -->
        <div class="form-grid-3">
          <div class="input-group">
            <label for="newBirthPlace" class="input-label" id="uiLabelPlace">出生地（城市或經緯度）</label>
            <input type="text" id="newBirthPlace" class="form-control" value="泰國" placeholder="例如：台北、曼谷、100.5, 13.75">
          </div>
          <div class="input-group">
            <label for="newGender" class="input-label" id="uiLabelGender">性別</label>
            <select id="newGender" class="form-control">
              <option value="男">男 (乾造)</option>
              <option value="女" selected>女 (坤造)</option>
            </select>
          </div>
          <div class="input-group">
            <label for="inputDeepInfraKey" class="input-label" id="uiLabelApiKey">API Key（DeepInfra 選填）</label>
            <input type="password" id="inputDeepInfraKey" class="form-control" placeholder="輸入 API Key">
          </div>
        </div>

        <!-- Row 3: 開始排盤按鈕 -->
        <div>
          <button id="btnSubmitNewClient" class="btn-calculate-main">
            <span>⚡</span>
            <span id="uiBtnSubmit">開始排盤</span>
          </button>
        </div>
      </div>
    </section>

    <!-- Main Chat Scroll Stream -->
    <main class="chat-scroll-area" id="chatScrollArea">
      <div class="chat-thread-container" id="chatMessagesContainer">
        <!-- Messages rendered by app.js -->
      </div>
    </main>

    <!-- Floating Bottom Input Bar -->
    <footer class="chat-bottom-wrapper">
      <div class="chat-input-pill">
        <textarea id="chatInputText" class="chat-textarea" rows="1" placeholder="向 Jack 老師提問...（Enter 送出，Shift+Enter 換行）"></textarea>
        <button id="btnSendMessage" class="btn-send-message" title="送出 (Enter)">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor">
            <path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/>
          </svg>
        </button>
      </div>
      <div class="footer-disclaimer" id="uiFooterDisclaimer">由 Jack 老師設計的 AI 工具 · 商業機密保護中</div>
    </footer>
  </div>

  <!-- Scripts -->
  <script src="iztro.min.js"></script>
  <script src="app.js?v=chatgpt_v1"></script>
</body>
</html>
