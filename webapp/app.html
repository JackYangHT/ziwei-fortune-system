<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Jack 老師 AI 命理工具</title>
  <link rel="icon" type="image/svg+xml" href="icon.svg">
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#000000">
  <link rel="stylesheet" href="chatgpt.css">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="chatgpt-app-container">
    <!-- Top Header -->
    <header class="chatgpt-header">
      <a href="/" class="brand-section" title="返回首頁 / Home">
        <span class="brand-logo">🔮</span>
        <span class="brand-name" id="uiBrandName"><span class="brand-main-text">Jack 老師</span><span class="brand-sub-text"> AI 命理</span></span>
      </a>

      <div class="header-actions">
        <!-- 語言切換選單 -->
        <select id="langToggleSelect" class="lang-select" title="切換語言 / Switch Language">
          <option value="zh">繁體中文</option>
          <option value="th">ไทย</option>
          <option value="en">English</option>
          <option value="ja">日本語</option>
        </select>

        <!-- 當前登入使用者與登出按鈕（登入後顯示） -->
        <div id="userHeaderSection" class="user-header-section" style="display: none;">
          <span class="user-badge" id="userBadge" title="目前使用者">
            <span class="user-badge-icon">👤</span>
            <span id="currentUserNameDisplay" class="user-name-text">訪客</span>
          </span>
          <button id="btnLogout" class="btn-logout" type="button" title="登出系統並清除資料">
            <span>🚪</span>
            <span id="uiLogoutText">登出</span>
          </button>
        </div>

        <!-- 電腦版操作按鈕群組 (手機版 < 768px 隱藏) -->
        <div class="desktop-header-actions" id="desktopHeaderActions">
          <button id="btnToggleInput" class="btn-header-action" title="收合或展開出生資料輸入區">
            <span id="btnToggleInputIcon">📝</span>
            <span id="btnToggleInputText">編輯出生資料</span>
          </button>
          <button id="btnShareDesensitized" class="btn-header-action" title="脫敏分享命盤報告">
            <span>🔒</span>
            <span id="btnShareText">脫敏分享</span>
          </button>
          <button id="btnSwitchAccount" class="btn-header-action" title="切換帳號（回到首頁）">
            <span>👤</span>
            <span id="btnSwitchAccountText">切換帳號</span>
          </button>
          <a href="/about" class="btn-header-action" id="uiAboutLink" title="關於 Jack 老師">
            <span>ℹ️</span>
            <span id="uiAboutLinkText">關於</span>
          </a>
        </div>

        <!-- 手機版目錄按鈕（小於 768px 顯示，最小尺寸 44x44px） -->
        <button id="btnMobileNavToggle" class="btn-mobile-nav-toggle" title="目錄" aria-label="打開目錄">
          <span class="nav-toggle-icon">☰</span>
          <span class="nav-toggle-text" id="uiMobileNavToggleText">目錄</span>
        </button>
      </div>
    </header>

    <!-- 手機版側邊選單遮罩與選單抽屜 (從左側滑出) -->
    <div id="mobileNavBackdrop" class="mobile-nav-backdrop"></div>
    <aside id="mobileNavDrawer" class="mobile-nav-drawer" aria-label="側邊目錄">
      <div class="drawer-header">
        <div class="drawer-brand">
          <span class="drawer-logo">🔮</span>
          <span class="drawer-title" id="uiDrawerTitle">Jack 老師</span>
        </div>
        <button id="btnMobileNavClose" class="btn-drawer-close" aria-label="關閉目錄">✕</button>
      </div>
      <nav class="drawer-nav">
        <!-- 1. 出生資料 -->
        <button id="btnDrawerToggleInput" class="drawer-nav-item">
          <span class="drawer-icon">📋</span>
          <span id="uiDrawerBirthText">出生資料</span>
        </button>
        <!-- 2. 脫敏分享 -->
        <button id="btnDrawerShare" class="drawer-nav-item">
          <span class="drawer-icon">🔒</span>
          <span id="uiDrawerShareText">脫敏分享</span>
        </button>
        <!-- 3. 切換帳號 -->
        <button id="btnDrawerSwitchAccount" class="drawer-nav-item">
          <span class="drawer-icon">👤</span>
          <span id="uiDrawerSwitchAccText">切換帳號</span>
        </button>
        <!-- 4. 登出按鈕 -->
        <button id="btnDrawerLogout" class="drawer-nav-item drawer-logout-item" style="display: none;">
          <span class="drawer-icon">🚪</span>
          <span id="uiDrawerLogoutText">登出</span>
        </button>
        <!-- 5. 關於我們 -->
        <a href="/about" id="uiDrawerAboutLink" class="drawer-nav-item">
          <span class="drawer-icon">ℹ️</span>
          <span id="uiDrawerAboutText">關於我們</span>
        </a>
      </nav>
    </aside>

    <!-- 登入畫面 (未登入時顯示，取代輸入區) -->
    <section id="loginViewContainer" class="login-view-container" style="display: none;">
      <div class="login-card">
        <div class="login-brand-icon">🔮</div>
        <h1 class="login-title" id="uiLoginTitle">Jack 老師 AI 命理</h1>
        <p class="login-subtitle" id="uiLoginSubtitle">請輸入你的名字或代號以進入個人命理系統</p>
        <div class="login-form-group">
          <label for="loginUsernameInput" class="login-label" id="uiLoginLabel">請輸入你的名字或代號</label>
          <input type="text" id="loginUsernameInput" class="login-input" placeholder="請輸入你的名字或代號" autocomplete="nickname">
        </div>
        <button id="btnLoginSubmit" class="btn-login-submit" type="button">
          <span>✨</span>
          <span id="uiBtnLoginText">登入</span>
        </button>
      </div>
    </section>

    <!-- Top Collapsible Input Form Area -->
    <section id="inputSectionWrapper" class="input-section-wrapper">
      <div class="input-card">
        <div class="input-card-header">
          <span class="input-card-title">
            <span>📋</span>
            <span id="uiInputCardTitle">出生資料輸入（排盤基準）</span>
          </span>
          <button id="btnCloseInputCard" class="btn-collapse-toggle" title="收合輸入區">✕ 收合</button>
        </div>

        <!-- 任務二提示橫幅 -->
        <div id="birthInputPromptBanner" class="birth-input-prompt-banner" style="background: rgba(234, 179, 8, 0.12); border: 1px solid rgba(234, 179, 8, 0.35); border-radius: 8px; padding: 10px 14px; margin-bottom: 16px; color: #fde047; font-size: 0.95rem; font-weight: 600; display: flex; align-items: center; gap: 8px;">
          <span>💡</span>
          <span id="uiBirthPromptText">請輸入你的出生資料，Jack 老師才能幫你排盤。</span>
        </div>

        <!-- Row 1: 姓名、出生日期、出生時間 -->
        <div class="form-grid-3">
          <div class="input-group">
            <label for="newClientName" class="input-label" id="uiLabelName">姓名（選填）</label>
            <input type="text" id="newClientName" class="form-control" placeholder="例如：張先生、李小姐">
          </div>
          <div class="input-group">
            <label for="newBirthday" class="input-label" id="uiLabelBirthday">出生日期 (西元 / 日曆與備用下拉)</label>
            <input type="date" id="newBirthday" class="form-control" value="">
            <div style="font-size:0.75rem; color:#94a3b8; margin-top:4px;" id="uiDefaultFactoryHint">（系統工廠原始資料：1900-01-01 子時）</div>
            <!-- 備用下拉選單 (解決 Android 無法彈出日曆問題) -->
            <div class="birthday-selects-grid" id="birthdaySelectsGrid">
              <select id="birthYearSelect" class="form-control birth-dropdown" title="選擇出生年份"></select>
              <select id="birthMonthSelect" class="form-control birth-dropdown" title="選擇出生月份"></select>
              <select id="birthDaySelect" class="form-control birth-dropdown" title="選擇出生日期"></select>
            </div>
          </div>
          <div class="input-group">
            <label for="newBirthClockTime" class="input-label" id="uiLabelClockTime">出生時間 (HH:mm)</label>
            <input type="time" id="newBirthClockTime" class="form-control" value="" placeholder="HH:mm">
          </div>
        </div>

        <!-- Row 2: 出生地、性別、API Key -->
        <div class="form-grid-3">
          <div class="input-group">
            <label for="newBirthPlace" class="input-label" id="uiLabelPlace">出生地（城市或經緯度）</label>
            <input type="text" id="newBirthPlace" class="form-control" value="" placeholder="例如：台北、曼谷、100.5, 13.75">
          </div>
          <div class="input-group">
            <label for="newGender" class="input-label" id="uiLabelGender">性別</label>
            <select id="newGender" class="form-control" onchange="this.blur()">
              <option value="男" selected>男 (乾造)</option>
              <option value="女">女 (坤造)</option>
            </select>
          </div>
          <div class="input-group">
            <label for="inputDeepInfraKey" class="input-label" id="uiLabelApiKey">API Key（DeepInfra 選填）</label>
            <input type="password" id="inputDeepInfraKey" class="form-control" placeholder="輸入 API Key">
          </div>
        </div>

        <!-- Row 3: 開始排盤按鈕 -->
        <div>
          <button id="btnSubmitNewClient" class="btn-calculate-main">
            <span>⚡</span>
            <span id="uiBtnSubmit">開始排盤</span>
          </button>
        </div>
      </div>
    </section>

    <!-- Main Chat Scroll Stream -->
    <main class="chat-scroll-area" id="chatScrollArea">
      <div class="chat-thread-container" id="chatMessagesContainer">
        <!-- Messages rendered by app.js -->
      </div>
    </main>

    <!-- Drag & Drop Full-screen Overlay -->
    <div id="dragDropOverlay" class="drag-drop-overlay" style="display:none;">
      <div class="drag-drop-box">
        <span class="drag-drop-icon">📎</span>
        <div class="drag-drop-title">拖放圖片或檔案至此處讀取</div>
        <div class="drag-drop-sub">支援 JPG、PNG、WebP、PDF、DOCX、TXT · 僅讀取內容，絕不保留檔案</div>
      </div>
    </div>

    <!-- Floating Bottom Input Bar -->
    <footer class="chat-bottom-wrapper">
      <!-- Skip Typing Animation Button (Visible only during active typewriter effect) -->
      <div id="skipTypingWrapper" class="skip-typing-wrapper" style="display:none;">
        <button type="button" id="btnSkipTyping" class="btn-skip-typing" title="點擊跳過打字動畫 / Skip animation">
          ⏩ <span id="btnSkipTypingText">跳過動畫</span>
        </button>
      </div>

      <!-- Attachment Preview Zone (Memory Only) -->
      <div id="attachmentPreviewZone" class="attachment-preview-zone" style="display:none;"></div>

      <div class="chat-input-pill">
        <!-- 📎 附加檔案按鈕 -->
        <button type="button" id="btnAttachFile" class="btn-attach-file" title="📎 附加檔案或圖片（JPG/PNG/WebP/PDF/DOCX/TXT，僅讀取不保留）">
          📎
        </button>
        <input type="file" id="fileAttachmentInput" accept="image/jpeg,image/png,image/webp,.pdf,.docx,.txt" multiple style="display:none;">

        <textarea id="chatInputText" class="chat-textarea" rows="1" placeholder="向 Jack 老師提問...（可附加平面圖問財位，Enter 送出，Shift+Enter 換行）"></textarea>
        <button id="btnSendMessage" class="btn-send-message" title="送出 (Enter)">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor">
            <path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/>
          </svg>
        </button>
      </div>

      <div class="privacy-attachment-hint" id="privacyAttachmentHint">
        <span>🔒</span>
        <span id="privacyAttachmentHintText">您的檔案只會被讀取，不會被保留。對話結束後自動刪除。</span>
      </div>
      <div class="footer-disclaimer" id="uiFooterDisclaimer">由 Jack 老師設計的 AI 工具 · 商業機密保護中</div>
    </footer>
  </div>

  <!-- Third-party Client-side Document Extractors (CDN) -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.6.0/mammoth.browser.min.js"></script>
  <!-- Scripts -->
  <script src="lunar.js"></script>
  <script src="iztro.min.js"></script>
  <script src="app.js?v=v4.1"></script>
</body>
</html>
