<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>關於 Jack 老師 - AI 命理工具</title>
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      background-color: #000000;
      color: #e2e8f0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 32px 20px;
      line-height: 1.75;
    }
    .about-card {
      width: 100%;
      max-width: 620px;
      background: #0a0f1d;
      border: 1px solid #1e293b;
      border-radius: 20px;
      padding: 40px 32px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.7);
    }
    .header-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 28px;
      padding-bottom: 18px;
      border-bottom: 1px solid #1e293b;
    }
    .about-title {
      font-size: 1.75rem;
      font-weight: 700;
      color: #f8fafc;
      letter-spacing: 0.5px;
    }
    .lang-switcher-select {
      background: #1e293b;
      color: #cbd5e1;
      border: 1px solid #334155;
      border-radius: 8px;
      padding: 6px 12px;
      font-size: 0.85rem;
      cursor: pointer;
      outline: none;
    }
    .lang-switcher-select:hover {
      border-color: #64748b;
    }
    .intro-paragraph {
      font-size: 1.05rem;
      color: #f1f5f9;
      font-weight: 500;
      margin-bottom: 24px;
    }
    .section-block {
      margin-bottom: 22px;
    }
    .section-title {
      font-size: 1rem;
      font-weight: 700;
      color: #60a5fa;
      margin-bottom: 8px;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .point-list {
      list-style: none;
      padding-left: 0;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .point-list li {
      position: relative;
      padding-left: 18px;
      color: #cbd5e1;
      font-size: 0.95rem;
    }
    .point-list li::before {
      content: "•";
      position: absolute;
      left: 0;
      color: #3b82f6;
      font-weight: bold;
    }
    .num-list {
      list-style: none;
      padding-left: 0;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .num-list li {
      position: relative;
      padding-left: 24px;
      color: #cbd5e1;
      font-size: 0.95rem;
    }
    .num-list li .num-idx {
      position: absolute;
      left: 0;
      color: #38bdf8;
      font-weight: 600;
    }
    .belief-box {
      background: #111827;
      border-left: 4px solid #3b82f6;
      padding: 14px 18px;
      border-radius: 0 10px 10px 0;
      margin: 24px 0;
      font-size: 1rem;
      font-weight: 600;
      color: #f8fafc;
      letter-spacing: 0.3px;
    }
    .ready-paragraph {
      font-size: 1rem;
      color: #e2e8f0;
      margin: 24px 0 28px 0;
      font-weight: 500;
    }
    .btn-action-container {
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin-top: 10px;
    }
    .btn-start {
      background: linear-gradient(135deg, #2563eb, #1d4ed8);
      color: #ffffff;
      border: none;
      border-radius: 12px;
      padding: 16px 24px;
      font-size: 1.15rem;
      font-weight: 700;
      cursor: pointer;
      width: 100%;
      text-align: center;
      transition: all 0.2s ease-in-out;
      box-shadow: 0 4px 14px rgba(37, 99, 235, 0.4);
      letter-spacing: 0.5px;
    }
    .btn-start:hover {
      background: linear-gradient(135deg, #1d4ed8, #1e40af);
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(37, 99, 235, 0.55);
    }
    .btn-start:active {
      transform: translateY(0);
    }
    .back-link {
      color: #64748b;
      font-size: 0.85rem;
      text-align: center;
      text-decoration: none;
      cursor: pointer;
      transition: color 0.15s;
    }
    .back-link:hover {
      color: #94a3b8;
    }
    @media (max-width: 480px) {
      .about-card {
        padding: 28px 20px;
        border-radius: 16px;
      }
      .about-title {
        font-size: 1.45rem;
      }
      .btn-start {
        padding: 14px 20px;
        font-size: 1.05rem;
      }
    }
  </style>
</head>
<body>
  <div class="about-card">
    <div class="header-bar">
      <h1 class="about-title" id="pageTitle">關於 Jack 老師</h1>
      <select id="langSelect" class="lang-switcher-select" onchange="changeLang(this.value)">
        <option value="zh">繁體中文</option>
        <option value="th">ไทย</option>
        <option value="en">English</option>
        <option value="ja">日本語</option>
      </select>
    </div>

    <p class="intro-paragraph" id="introText">這是一套由 Jack 老師設計的 AI 命理工具。</p>

    <div class="section-block">
      <div class="section-title" id="coreHeader">核心邏輯：</div>
      <ul class="point-list" id="corePointsList">
        <!-- Rendered by JS -->
      </ul>
    </div>

    <div class="belief-box" id="beliefBox">
      <!-- Rendered by JS -->
    </div>

    <div class="section-block">
      <div class="section-title" id="systemHeader">這套系統會：</div>
      <ul class="num-list" id="systemPointsList">
        <!-- Rendered by JS -->
      </ul>
    </div>

    <p class="ready-paragraph" id="readyText">準備好了嗎？輸入你的出生資料，讓 Jack 老師幫你看看。</p>

    <div class="btn-action-container">
      <button class="btn-start" id="btnStart" onclick="startApp()">開始使用</button>
      <a class="back-link" onclick="goBackLanding()">← 返回語言選擇 / Back</a>
    </div>
  </div>

  <script>
    const ABOUT_CONTENT = {
      zh: {
        pageTitle: "關於 Jack 老師",
        intro: "這是一套由 Jack 老師設計的 AI 命理工具。",
        coreHeader: "核心邏輯：",
        corePoints: [
          "命，是生出來的。你的出生時間決定了你的先天命盤，一生不變。",
          "運，就在命盤裡。命盤就像 GPS，告訴你什麼時候該走哪條路。",
          "人，創造機會。在對的時間，做對的事，機會才會來。"
        ],
        beliefHeader: "我們相信：",
        beliefText: "命是定的，運是 GPS，機會是你做對決定。",
        systemHeader: "這套系統會：",
        systemPoints: [
          "排出你的先天命盤",
          "告訴你什麼時候運勢最強",
          "提前預警未來危機",
          "給你具體的布局建議"
        ],
        readyText: "準備好了嗎？輸入你的出生資料，讓 Jack 老師幫你看看。",
        btnStart: "開始使用"
      },
      th: {
        pageTitle: "เกี่ยวกับอาจารย์ Jack",
        intro: "นี่คือเครื่องมือดูดวง AI ที่ออกแบบโดยอาจารย์ Jack",
        coreHeader: "หลักการ核心：",
        corePoints: [
          "ชะตา เกิดมาตั้งแต่เกิด เวลาเกิดกำหนดดวงชะตาตายตัว ไม่เปลี่ยนตลอดชีวิต",
          "ดวง อยู่ในแผนที่ชะตา แผนที่ชะตาเหมือน GPS บอกว่าควรไปทางไหนเมื่อไหร่",
          "คน สร้างโอกาส ทำสิ่งที่ถูกต้องในเวลาที่ถูกต้อง โอกาสจึงจะมา"
        ],
        beliefHeader: "เราเชื่อว่า：",
        beliefText: "ชะตากำหนดแล้ว ดวงคือ GPS โอกาสคือการตัดสินใจที่ถูกต้อง",
        systemHeader: "ระบบนี้จะ：",
        systemPoints: [
          "ผูกดวงชะตาตายตัวของคุณ",
          "บอกว่าช่วงไหนดวงแข็งแกร่งที่สุด",
          "เตือนวิกฤตล่วงหน้า",
          "ให้คำแนะนำการวางแผนที่具體"
        ],
        readyText: "พร้อมหรือยัง？ กรอกข้อมูลเกิดของคุณ ให้อาจารย์ Jack ดูให้",
        btnStart: "เริ่มต้นใช้งาน"
      },
      en: {
        pageTitle: "About Jack 老師",
        intro: "This is an AI astrology tool designed by Jack 老師.",
        coreHeader: "Core Logic:",
        corePoints: [
          "Destiny is born. Your birth time determines your natal chart, unchanging for life.",
          "Fortune is the GPS. Your chart is like a GPS, telling you which path to take and when.",
          "Opportunity is created. Do the right thing at the right time, and opportunity will come."
        ],
        beliefHeader: "We believe:",
        beliefText: "Destiny is fixed, fortune is GPS, opportunity is your right decision.",
        systemHeader: "This system will:",
        systemPoints: [
          "Generate your natal chart",
          "Tell you when your fortune is strongest",
          "Warn you of future crises",
          "Give you specific layout suggestions"
        ],
        readyText: "Ready? Enter your birth data and let Jack 老師 take a look.",
        btnStart: "Get Started"
      },
      ja: {
        pageTitle: "Jack 先生について",
        intro: "これは Jack 先生が設計した AI 占術ツールです。",
        coreHeader: "核心ロジック：",
        corePoints: [
          "命は生まれる。生まれた時間が先天の命盤を決め、一生変わりません。",
          "運は GPS。命盤は GPS のように、いつどの道を進むべきかを教えてくれます。",
          "人は機会を創る。正しい時に正しいことをすれば、機会が訪れます。"
        ],
        beliefHeader: "私たちは信じています：",
        beliefText: "命は定まり、運は GPS、機会はあなたの正しい決断です。",
        systemHeader: "このシステムは：",
        systemPoints: [
          "あなたの先天命盤を排出します",
          "いつ運勢が最強かを教えます",
          "未来の危機を事前に警告します",
          "具体的な布局アドバイスを提供します"
        ],
        readyText: "準備はいいですか？生年月日を入力して、Jack 先生に見てもらいましょう。",
        btnStart: "利用開始"
      }
    };

    function getCurrentLang() {
      try {
        const saved = localStorage.getItem('ziwei_preferred_lang');
        if (saved && ABOUT_CONTENT[saved]) return saved;
      } catch (e) {}
      return 'zh';
    }

    function renderAbout(lang) {
      const data = ABOUT_CONTENT[lang] || ABOUT_CONTENT.zh;

      document.getElementById('pageTitle').innerText = data.pageTitle;
      document.getElementById('introText').innerText = data.intro;
      document.getElementById('coreHeader').innerText = data.coreHeader;

      const coreList = document.getElementById('corePointsList');
      coreList.innerHTML = '';
      data.corePoints.forEach(pt => {
        const li = document.createElement('li');
        li.innerText = pt;
        coreList.appendChild(li);
      });

      document.getElementById('beliefBox').innerHTML = `
        <div style="font-size:0.85rem;color:#94a3b8;margin-bottom:4px;">${data.beliefHeader}</div>
        <div>${data.beliefText}</div>
      `;

      document.getElementById('systemHeader').innerText = data.systemHeader;

      const sysList = document.getElementById('systemPointsList');
      sysList.innerHTML = '';
      data.systemPoints.forEach((pt, idx) => {
        const li = document.createElement('li');
        li.innerHTML = `<span class="num-idx">${idx + 1}.</span>${pt}`;
        sysList.appendChild(li);
      });

      document.getElementById('readyText').innerText = data.readyText;
      document.getElementById('btnStart').innerText = data.btnStart;

      document.getElementById('langSelect').value = lang;
    }

    function changeLang(lang) {
      try {
        localStorage.setItem('ziwei_preferred_lang', lang);
      } catch (e) {}
      renderAbout(lang);
    }

    function startApp() {
      if (window.location.protocol === 'file:') {
        window.location.href = 'app.html';
      } else {
        window.location.href = '/app';
      }
    }

    function goBackLanding() {
      if (window.location.protocol === 'file:') {
        window.location.href = 'landing.html';
      } else {
        window.location.href = '/';
      }
    }

    // Initialize on load
    document.addEventListener('DOMContentLoaded', () => {
      const lang = getCurrentLang();
      renderAbout(lang);
    });
  </script>
</body>
</html>
