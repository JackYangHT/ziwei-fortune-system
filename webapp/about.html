    function getCurrentLang() {
      try {
        const saved = localStorage.getItem('ziwei_preferred_lang');
        if (saved && ABOUT_CONTENT[saved]) return saved;
      } catch (e) {}
      return 'zh';
    }

    function renderAbout(lang) {
      const data = ABOUT_CONTENT[lang] || ABOUT_CONTENT.zh;

      document.getElementById('pageTitle').innerText = data.pageTitle;
      document.getElementById('introText').innerText = data.intro;
      document.getElementById('coreHeader').innerText = data.coreHeader;

      const coreList = document.getElementById('corePointsList');
      coreList.innerHTML = '';
      data.corePoints.forEach(pt => {
        const li = document.createElement('li');
        li.innerText = pt;
        coreList.appendChild(li);
      });

      document.getElementById('beliefBox').innerHTML = `
        <div style="font-size:0.85rem;color:#94a3b8;margin-bottom:4px;">${data.beliefHeader}</div>
        <div>${data.beliefText}</div>
      `;

      const privBox = document.getElementById('privacyBox');
      if (privBox && data.privacyHeader) {
        privBox.innerHTML = `
          <div style="font-size:0.85rem;color:#34d399;font-weight:600;margin-bottom:4px;">🔒 ${data.privacyHeader}</div>
          <div>${data.privacyText}</div>
        `;
      }

      document.getElementById('systemHeader').innerText = data.systemHeader;

      const sysList = document.getElementById('systemPointsList');
      sysList.innerHTML = '';
      data.systemPoints.forEach((pt, idx) => {
        const li = document.createElement('li');
        li.innerHTML = `<span class="num-idx">${idx + 1}.</span>${pt}`;
        sysList.appendChild(li);
      });

      const archHeaderEl = document.getElementById('archHeader');
      if (archHeaderEl && data.archHeader) archHeaderEl.innerText = data.archHeader;

      const archContainer = document.getElementById('archContentContainer');
      if (archContainer && data.architecture) {
        archContainer.innerHTML = '';
        data.architecture.forEach(sec => {
          const block = document.createElement('div');
          block.className = 'arch-sub-block';

          let html = `<div class="arch-sub-title">✨ ${sec.title}</div>`;
          if (sec.desc) {
            html += `<p class="arch-sub-desc">${sec.desc}</p>`;
          }
          if (sec.subtitle) {
            html += `<div style="font-size:0.88rem;color:#94a3b8;font-weight:600;margin:6px 0 4px 0;">${sec.subtitle}</div>`;
          }
          if (sec.items && sec.items.length) {
            html += `<ul class="arch-sub-list">` + sec.items.map(it => `<li>${it}</li>`).join('') + `</ul>`;
          }
          if (sec.numItems && sec.numItems.length) {
            html += `<ul class="arch-sub-num-list">` + sec.numItems.map((it, idx) => `<li><span class="num-idx">${idx + 1}.</span>${it}</li>`).join('') + `</ul>`;
          }
          if (sec.conclusion) {
            html += `<div class="arch-highlight-box">${sec.conclusion}</div>`;
          }
          if (sec.lines && sec.lines.length) {
            html += sec.lines.map(line => `<p class="arch-sub-desc" style="font-weight:500;">${line}</p>`).join('');
          }

          block.innerHTML = html;
          archContainer.appendChild(block);
        });
      }

      document.getElementById('readyText').innerText = data.readyText;
      document.getElementById('btnStart').innerText = data.btnStart;

      document.getElementById('langSelect').value = lang;
    }

    function changeLang(lang) {
      try {
        localStorage.setItem('ziwei_preferred_lang', lang);
      } catch (e) {}
      renderAbout(lang);
    }

    function startApp() {
      if (window.location.protocol === 'file:') {
        window.location.href = 'app.html';
      } else {
        window.location.href = '/app';
      }
    }

    function goBackLanding() {
      if (window.location.protocol === 'file:') {
        window.location.href = 'landing.html';
      } else {
        window.location.href = '/';
      }
    }

    // Initialize on load
    document.addEventListener('DOMContentLoaded', () => {
      const lang = getCurrentLang();
      renderAbout(lang);
    });
  </script>
