      color: #f8fafc;
      letter-spacing: 0.5px;

      border-radius: 8px;
      padding: 6px 12px;

    }

      color: #f1f5f9;

      color: #60a5fa;
      margin-bottom: 8px;
      display: flex;
      align-items: center;

    }
    .point-list {
      list-style: none;
      padding-left: 0;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .point-list li {
      position: relative;
      padding-left: 18px;
      color: #cbd5e1;
      font-size: 0.95rem;
    }
    .point-list li::before {
      content: "•";
      position: absolute;
      left: 0;
      color: #3b82f6;
      font-weight: bold;
    }
    .num-list {
      list-style: none;
      padding-left: 0;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .num-list li {
      position: relative;
      padding-left: 24px;
      color: #cbd5e1;
      font-size: 0.95rem;
    }
    .num-list li .num-idx {
      position: absolute;
      left: 0;
      color: #38bdf8;
      font-weight: 600;
    }
    .belief-box {
      background: #111827;
      border-left: 4px solid #3b82f6;
      padding: 14px 18px;
      border-radius: 0 10px 10px 0;
      margin: 24px 0;
      font-size: 1rem;
      font-weight: 600;
      color: #f8fafc;
      letter-spacing: 0.3px;
    }

      background: #0f172a;
      border-left: 4px solid #10b981;
      padding: 14px 18px;
      border-radius: 0 10px 10px 0;
      margin: 20px 0;
      font-size: 0.95rem;
      color: #e2e8f0;
      line-height: 1.6;
    }
    .ready-paragraph {
      font-size: 1rem;
      color: #e2e8f0;
      margin: 24px 0 28px 0;
      font-weight: 500;
    }
    .btn-action-container {
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin-top: 10px;
    }
    .btn-start {
      background: linear-gradient(135deg, #2563eb, #1d4ed8);
      color: #ffffff;
      border: none;
      border-radius: 12px;
      padding: 16px 24px;
      font-size: 1.15rem;
      font-weight: 700;
      cursor: pointer;
      width: 100%;
      text-align: center;
      transition: all 0.2s ease-in-out;
      box-shadow: 0 4px 14px rgba(37, 99, 235, 0.4);
      letter-spacing: 0.5px;
    }
    .btn-start:hover {
      background: linear-gradient(135deg, #1d4ed8, #1e40af);
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(37, 99, 235, 0.55);
    }
    .btn-start:active {
      transform: translateY(0);
    }
    .back-link {
      color: #64748b;
      font-size: 0.85rem;
      text-align: center;
      text-decoration: none;
      cursor: pointer;
      transition: color 0.15s;
    }

      color: #94a3b8;
    }

      } catch (e) {}
      return 'zh';
    }

        <div>${data.beliefText}</div>

      if (privBox && data.privacyHeader) {
        privBox.innerHTML = `
          <div style="font-size:0.85rem;color:#34d399;font-weight:600;margin-bottom:4px;">🔒 ${data.privacyHeader}</div>
          <div>${data.privacyText}</div>
        `;
      }

      document.getElementById('systemHeader').innerText = data.systemHeader;

      const sysList = document.getElementById('systemPointsList');
      sysList.innerHTML = '';
      data.systemPoints.forEach((pt, idx) => {
        const li = document.createElement('li');
        li.innerHTML = `<span class="num-idx">${idx + 1}.</span>${pt}`;
        sysList.appendChild(li);
      });

      const archHeaderEl = document.getElementById('archHeader');
      if (archHeaderEl && data.archHeader) archHeaderEl.innerText = data.archHeader;

      const archList = document.getElementById('archPointsList');
      if (archList && data.archPoints) {
        archList.innerHTML = '';
        data.archPoints.forEach((pt, idx) => {
          const li = document.createElement('li');
          li.innerHTML = `<span class="num-idx">${idx + 1}.</span>${pt}`;
          archList.appendChild(li);
        });
      }

      document.getElementById('readyText').innerText = data.readyText;
      document.getElementById('btnStart').innerText = data.btnStart;

      document.getElementById('langSelect').value = lang;
    }

    function changeLang(lang) {
      try {
        localStorage.setItem('ziwei_preferred_lang', lang);
      } catch (e) {}
      renderAbout(lang);
    }

    function startApp() {
      if (window.location.protocol === 'file:') {
        window.location.href = 'app.html';
      } else {
        window.location.href = '/app';
      }
    }

    function goBackLanding() {
      if (window.location.protocol === 'file:') {
        window.location.href = 'landing.html';
      } else {
        window.location.href = '/';
      }
    }

    // Initialize on load
    document.addEventListener('DOMContentLoaded', () => {
      const lang = getCurrentLang();
      renderAbout(lang);
    });
  </script>
</body>
</html>
