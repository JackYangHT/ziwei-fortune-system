<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#312e81"/>
      <stop offset="50%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <radialGradient id="star" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fde047"/>
      <stop offset="100%" stop-color="#eab308" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="512" height="512" rx="128" fill="url(#bg)"/>
  <circle cx="256" cy="256" r="180" fill="none" stroke="#6366f1" stroke-width="4" stroke-dasharray="8 6"/>
  <circle cx="256" cy="256" r="140" fill="none" stroke="#818cf8" stroke-width="2"/>
  <circle cx="256" cy="256" r="120" fill="url(#star)" opacity="0.3"/>
  <!-- Center symbol -->
  <text x="256" y="275" font-size="160" text-anchor="middle" fill="#facc15" font-family="'Noto Serif TC', serif" font-weight="bold">斗</text>
  <text x="256" y="380" font-size="34" text-anchor="middle" fill="#e2e8f0" font-family="sans-serif" letter-spacing="6">滿天星 PLUS</text>
  <!-- 7 Stars -->
  <circle cx="256" cy="95" r="14" fill="#facc15"/>
  <circle cx="370" cy="142" r="12" fill="#38bdf8"/>
  <circle cx="417" cy="256" r="12" fill="#4ade80"/>
  <circle cx="370" cy="370" r="12" fill="#fb923c"/>
  <circle cx="142" cy="370" r="12" fill="#f472b6"/>
  <circle cx="95" cy="256" r="12" fill="#a78bfa"/>
  <circle cx="142" cy="142" r="12" fill="#e879f9"/>
</svg>
